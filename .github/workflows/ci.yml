name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Check for unresolved conflict markers
        run: |
          ! git grep -E "<<<<<<<|=======|>>>>>>>" src/ tests/ practice/ scripts/ sql/

      - name: Run Pytest suite
        run: |
          python -m pytest -q
          python -m pytest -q practice/test_mini_search.py
          python -m pytest -q practice/test_hello_api.py
          python -m pytest -q practice/test_school_repo.py

      - name: Run Lab 06 evaluation smoke check
        env:
          LLM_PROVIDER: stub
        run: |
          python eval/compare_paths.py --cases eval/cases_20.jsonl
          python eval/compare_paths.py

      - name: Run Lab 07 Streamlit warm-up
        working-directory: practice
        run: python -m pytest -q test_hello_streamlit.py

      - name: Check SQL practice answers
        run: |
          python practice/make_school_db.py
          python practice/check.py

      - name: Check code with Ruff
        run: |
          python -m ruff check .

      - name: Verify formatting with Ruff
        run: |
          python -m ruff format --check .

      - name: Check blind exceptions with Ruff (BLE)
        run: |
          python -m ruff check --select BLE .
